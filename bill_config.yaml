# bill_config.yaml
#
# One entry per bill sender.
#
# sender_match: Case-insensitive substring matched against the full "From" header.
#               Can be a domain, full address, or any unique fragment.
#
# split_divisor: Bill amount divided by this number to produce the "split" field
#                sent to Home Assistant. Adjust per bill as needed.
#
# amount.pattern:         Regex with one capturing group — the numeric amount.
# due_date.pattern:       Regex with one or more capturing groups for the date.
#                         Multiple groups are joined with a space before parsing.
# due_date.input_format:  strptime format string for the matched date string.
# due_date.output_format: strftime format string for the normalized date sent to HA.

bills:
  # --------------------------------------------------------------------------
  # Charlotte Water
  # From: customercare@ci.charlotte.nc.us
  # Email text: "Amount Due 71.85" / "Due Date 01/26/26"
  # --------------------------------------------------------------------------
  - sender_match: "ci.charlotte.nc.us"
    bill_name: "Water Bill"
    split_divisor: 2
    amount:
      pattern: 'Amount Due\s+([0-9]+(?:\.[0-9]{2})?)'
    due_date:
      pattern: 'Due Date\s+(\d{2}/\d{2}/\d{2})'
      input_format: "%m/%d/%y"
      output_format: "%m/%d/%y"

  # --------------------------------------------------------------------------
  # Spectrum Internet
  # From: MyAccount@spectrumemails.com
  # Email text: "Statement Amount:\n$79.99" / "Auto Pay Date:\nDecember 30, 2025"
  # Note: \s* in the amount pattern handles the newline between label and value.
  # --------------------------------------------------------------------------
  - sender_match: "spectrumemails.com"
    bill_name: "Internet (Spectrum)"
    split_divisor: 2
    amount:
      pattern: 'Statement Amount:\s*\$([0-9]+(?:\.[0-9]{2})?)'
    due_date:
      pattern: 'Auto Pay Date:\s*([A-Z][a-z]+ \d{1,2}, \d{4})'
      input_format: "%B %d, %Y"
      output_format: "%m/%d/%y"

  # --------------------------------------------------------------------------
  # Duke Energy (Power)
  # From: dukeenergypaperslessbilling@paperless.dukenergy.com
  # Email text: "Amount Due:\n$399.44" / "Due Date:\nJan. 5, 2026"
  # Note: Specific amount pattern required — email also contains "Prior Balance: $204.73"
  #       which would be matched first by a generic \$ pattern.
  # The date pattern captures month, day, year as three groups joined with a space.
  #   e.g. "Jan. 5, 2026" → ("Jan", "5", "2026") → "Jan 5 2026" → parsed with %b %d %Y
  # --------------------------------------------------------------------------
  - sender_match: "dukeenergy.com"
    bill_name: "Power Bill"
    split_divisor: 2
    amount:
      pattern: 'Amount Due:\s*\$([0-9]+(?:\.[0-9]{2})?)'
    due_date:
      pattern: 'Due Date:\s*([A-Za-z]+)\.?\s*(\d{1,2}),\s*(\d{4})'
      input_format:
        - "%B %d %Y"
        - "%b %d %Y"
      output_format: "%m/%d/%y"

  # --------------------------------------------------------------------------
  # Piedmont Natural Gas
  # From: alerts@info.piedmontng.com
  # Email text: "Amount Due: $158.54" / "Due Date: Jan. 26, 2026"
  # Same multi-group date pattern as Duke Energy (abbreviated month + period).
  # --------------------------------------------------------------------------
  - sender_match: "piedmontng.com"
    bill_name: "Gas Bill"
    split_divisor: 2
    amount:
      pattern: 'Amount Due:\s*\$([0-9]+(?:\.[0-9]{2})?)'
    due_date:
      pattern: 'Due Date:\s*([A-Za-z]+)\.?\s*(\d{1,2}),\s*(\d{4})'
      input_format:
        - "%B %d %Y"
        - "%b %d %Y"
      output_format: "%m/%d/%y"

  # --------------------------------------------------------------------------
  # Republic Services (Trash)
  # From: noreply@republicservices.com
  # Email text: "Your payment of $237.60 is due on 01/04/2026."
  # --------------------------------------------------------------------------
  - sender_match: "republicservices.com"
    bill_name: "Trash Bill"
    split_divisor: 2
    amount:
      pattern: '\$([0-9]+(?:\.[0-9]{2})?)'
    due_date:
      pattern: 'due on\s+(\d{2}/\d{2}/\d{4})'
      input_format: "%m/%d/%Y"
      output_format: "%m/%d/%y"
